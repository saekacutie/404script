entryPoints:
  web:
    address: ":8080"
    # keep the real client address in X-Forwarded-For (Cloud Run sends it) so
    # the panel can place visitors on the globe
    forwardedHeaders:
      insecure: true

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  dashboard: false

log:
  level: INFO
