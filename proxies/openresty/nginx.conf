worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    server_tokens off;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 3s;

    proxy_connect_timeout 10s;

    # --- Anti-DDoS: per-IP connection & request-rate limiting ---
    # Inherits down into every location{} in the server block below.
    # Tune rate/burst/conn to your expected legitimate traffic.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # FIXED: removed "http2 on;" here. nginx cannot serve HTTP/1.1 and
        # cleartext HTTP/2 on the same non-TLS listener - turning http2 on
        # made this whole server HTTP/2-only, which silently broke every
        # WS/httpupgrade/xhttp endpoint below (they need HTTP/1.1's Upgrade
        # mechanism). This engine now serves WS/httpupgrade/xhttp only -
        # for gRPC, use HAProxy, Envoy, Caddy, or H2O instead, which all do
        # real per-connection protocol detection.
        listen 8080 default_server backlog=4096;
        server_name _;
        limit_conn conn_limit 40;
        limit_req zone=req_limit burst=100 nodelay;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            access_log off;
        }

        # --- TROJAN ENDPOINTS (Longest prefixes placed first with ^~ modifier) ---
        location ^~ /saeka-tojirp-hu {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /saeka-tojirp-xh {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /saeka-tojirp {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- VMESS ENDPOINTS ---
        location ^~ /vmess-saeka-hu {
            proxy_pass http://127.0.0.1:10004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vmess-saeka-xh {
            proxy_pass http://127.0.0.1:10005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vmess-saeka {
            proxy_pass http://127.0.0.1:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- VLESS ENDPOINTS ---
        location ^~ /vless-saeka-hu {
            proxy_pass http://127.0.0.1:10007;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vless-saeka-xh {
            proxy_pass http://127.0.0.1:10008;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vless-saeka {
            proxy_pass http://127.0.0.1:10006;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- SHADOWSOCKS ENDPOINTS ---
        location ^~ /ss-saeka-hu {
            proxy_pass http://127.0.0.1:10010;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /ss-saeka-xh {
            proxy_pass http://127.0.0.1:10011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /ss-saeka {
            proxy_pass http://127.0.0.1:10009;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # gRPC deliberately not routed here - see note at top of this file.
        location ~ ^/(saeka-tojirp|vmess-saeka|vless-saeka|ss-saeka)-grpc$ {
            return 501 "gRPC is not supported on the OpenResty/nginx engine (HTTP/1.1 + h2c cleartext cannot share one port on nginx). Select HAProxy, Envoy, Caddy, or H2O for gRPC.\n";
            add_header Content-Type text/plain;
        }
    }
}
