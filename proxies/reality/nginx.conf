worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    default_type text/plain;

    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    tcp_nodelay on;
    tcp_nopush off;
    sendfile off;
    keepalive_timeout 3600;

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "dGhlIHNhbXBsZSBub25jZQ==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Written by entrypoint.sh: the "upstream xhttp_vm" block (empty when unused).
    include /etc/nginx/relay-upstream.conf;

    server {
        listen 8080;
        server_name _;

        location /health {
            return 200 "OK";
        }

        location = /saeka-ssh {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        location = /saeka-ovpn {
            proxy_pass http://127.0.0.1:2223;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        location = /saeka-tcp {
            proxy_pass http://127.0.0.1:2225;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        location = /cert {
            proxy_pass http://127.0.0.1:2224;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # Written by entrypoint.sh: the XHTTP relay "location" (empty when unused).
        include /etc/nginx/relay-location.conf;

        location / {
            return 200 "SAEKA Reality Gateway active.";
        }
    }
}
