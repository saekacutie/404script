listen: 8080

hosts:
  "default":
    paths:
      "/health":
        file.dir: /var/www/html
      "/saeka-ssh":
        proxy.reverse.url: "http://127.0.0.1:10016"
        proxy.websocket.enabled: ON
      "/saeka-tojirp-grpc":
        proxy.reverse.url: "http://127.0.0.1:10012"
        # NOTE: H2O generally negotiates the best protocol to backends it
        # controls, but forcing cleartext HTTP/2 to a plain http:// upstream
        # varies by H2O version. If gRPC over this engine misbehaves, this
        # directive is the first place to check against your H2O version's
        # current docs.
        proxy.http2.force-cleartext: ON
      "/saeka-tojirp-hu":
        proxy.reverse.url: "http://127.0.0.1:10001"
        proxy.websocket.enabled: ON
      "/saeka-tojirp-xh":
        proxy.reverse.url: "http://127.0.0.1:10002"
        proxy.http2.force-cleartext: ON
      "/saeka-tojirp":
        proxy.reverse.url: "http://127.0.0.1:10000"
        proxy.websocket.enabled: ON

      "/vmess-saeka-grpc":
        proxy.reverse.url: "http://127.0.0.1:10013"
        proxy.http2.force-cleartext: ON
      "/vmess-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10004"
        proxy.websocket.enabled: ON
      "/vmess-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10005"
        proxy.http2.force-cleartext: ON
      "/vmess-saeka":
        proxy.reverse.url: "http://127.0.0.1:10003"
        proxy.websocket.enabled: ON

      "/vless-saeka-grpc":
        proxy.reverse.url: "http://127.0.0.1:10014"
        proxy.http2.force-cleartext: ON
      "/vless-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10007"
        proxy.websocket.enabled: ON
      "/vless-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10008"
        proxy.http2.force-cleartext: ON
      "/vless-saeka":
        proxy.reverse.url: "http://127.0.0.1:10006"
        proxy.websocket.enabled: ON

      "/ss-saeka-grpc":
        proxy.reverse.url: "http://127.0.0.1:10015"
        proxy.http2.force-cleartext: ON
      "/ss-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10010"
        proxy.websocket.enabled: ON
      "/ss-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10011"
        proxy.http2.force-cleartext: ON
      "/ss-saeka":
        proxy.reverse.url: "http://127.0.0.1:10009"
        proxy.websocket.enabled: ON

access-log: /dev/stdout
error-log: /dev/stderr
