global
    maxconn 65535
    log stdout format raw local0

defaults
    mode http
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s
    timeout tunnel  3600s
    option httplog

frontend main
    # FIXED: was `bind :8080 proto h2c`. HAProxy's cleartext `proto h2c`
    # on a bind line is prior-knowledge-only - it does NOT auto-negotiate
    # per connection like Envoy's codec_type:AUTO or Caddy's
    # `protocols h1 h2c` do. It forces every connection to open with the
    # HTTP/2 preface, so plain HTTP/1.1 clients get reset outright -
    # including Cloud Run's own default traffic to this container, which
    # is HTTP/1.1 unless the service is deployed with --use-http2. That's
    # what broke every WS/HU/XH endpoint (and very likely why the
    # deployment itself failed - Cloud Run's readiness check speaks
    # HTTP/1.1 too). Binding plain HTTP/1.1 here is what actually matches
    # what Cloud Run sends by default.
    bind :8080

    # CAVEAT (real limitation, not a bug to "fix" away): gRPC and the H2
    # ("http" transport) routes below need the CLIENT to open a genuine
    # HTTP/2 connection to reach this frontend at all now - Cloud Run
    # only forwards real h2c end-to-end if this service is deployed with
    # `gcloud run deploy --use-http2`, and turning that on stops Cloud
    # Run's automatic downgrade-to-HTTP/1.1 for EVERYTHING, which would
    # in turn break WS/HU/XH for clients that don't speak HTTP/2. HAProxy
    # has no built-in way to auto-detect h1.1 vs h2c per connection on a
    # single cleartext port the way Envoy/Caddy/Traefik/H2O do - so on
    # Cloud Run specifically, this engine can serve WS/HU/XH (this file,
    # as configured) OR gRPC/H2 (redeploy with --use-http2), not
    # reliably both from the same service. If you need both at once,
    # pick Envoy or Caddy instead - their frontends already do real
    # per-connection h1/h2c detection, which is why they don't carry
    # this caveat.

    # --- Anti-DDoS: per-source-IP connection & request-rate limiting ---
    # Table tracks each client IP for 30s; abusive rates get a 429 instead
    # of tying up a backend worker. Tune the thresholds to your traffic.
    stick-table type ip size 200k expire 30s store conn_cur,conn_rate(10s),http_req_rate(10s)
    tcp-request connection track-sc0 src
    acl too_many_conns sc0_conn_cur gt 60
    acl conn_rate_abuse sc0_conn_rate gt 100
    acl req_rate_abuse sc0_http_req_rate gt 200
    http-request deny deny_status 429 if too_many_conns
    http-request deny deny_status 429 if conn_rate_abuse
    http-request deny deny_status 429 if req_rate_abuse

    # Health check
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # Trojan ACLs (longest prefix first)
    acl path_trojan_grpc path_beg /saeka-tojirp-grpc
    acl path_trojan_hu path_beg /saeka-tojirp-hu
    acl path_trojan_xh path_beg /saeka-tojirp-xh
    acl path_trojan_ws path_beg /saeka-tojirp

    # VMess ACLs
    acl path_vmess_grpc path_beg /vmess-saeka-grpc
    acl path_vmess_hu path_beg /vmess-saeka-hu
    acl path_vmess_xh path_beg /vmess-saeka-xh
    acl path_vmess_ws path_beg /vmess-saeka

    # VLESS ACLs
    acl path_vless_grpc path_beg /vless-saeka-grpc
    acl path_vless_hu path_beg /vless-saeka-hu
    acl path_vless_xh path_beg /vless-saeka-xh
    acl path_vless_ws path_beg /vless-saeka

    # Shadowsocks ACLs
    acl path_ss_grpc path_beg /ss-saeka-grpc
    acl path_ss_hu path_beg /ss-saeka-hu
    acl path_ss_xh path_beg /ss-saeka-xh
    acl path_ss_ws path_beg /ss-saeka

    # SSH-over-WS - raw byte tunnel, same WS pattern as everything else.
    # (OpenVPN-over-WS was removed: OpenVPN needs a TUN device, which
    # Cloud Run's sandbox never grants - see README. OpenVPN lives on
    # the companion VM from deploy_vm.py instead.)
    acl path_ssh_ws path_beg /saeka-ssh

    # H2 (Xray "http" transport - real HTTP/2 duplex, distinct from xhttp)
    acl path_trojan_h2 path_beg /saeka-tojirp-h2
    acl path_vmess_h2 path_beg /vmess-saeka-h2
    acl path_vless_h2 path_beg /vless-saeka-h2
    acl path_ss_h2 path_beg /ss-saeka-h2

    use_backend bk_10012_grpc if path_trojan_grpc
    use_backend bk_10016_h2 if path_trojan_h2
    use_backend bk_10001 if path_trojan_hu
    use_backend bk_10002 if path_trojan_xh
    use_backend bk_10000 if path_trojan_ws

    use_backend bk_10013_grpc if path_vmess_grpc
    use_backend bk_10017_h2 if path_vmess_h2
    use_backend bk_10004 if path_vmess_hu
    use_backend bk_10005 if path_vmess_xh
    use_backend bk_10003 if path_vmess_ws

    use_backend bk_10014_grpc if path_vless_grpc
    use_backend bk_10018_h2 if path_vless_h2
    use_backend bk_10007 if path_vless_hu
    use_backend bk_10008 if path_vless_xh
    use_backend bk_10006 if path_vless_ws

    use_backend bk_10015_grpc if path_ss_grpc
    use_backend bk_10019_h2 if path_ss_h2
    use_backend bk_10010 if path_ss_hu
    use_backend bk_10011 if path_ss_xh
    use_backend bk_10009 if path_ss_ws

    use_backend bk_10020_ssh if path_ssh_ws

backend bk_10000
    server s1 127.0.0.1:10000
backend bk_10001
    server s1 127.0.0.1:10001
backend bk_10002
    server s1 127.0.0.1:10002 proto h2
backend bk_10003
    server s1 127.0.0.1:10003
backend bk_10004
    server s1 127.0.0.1:10004
backend bk_10005
    server s1 127.0.0.1:10005 proto h2
backend bk_10006
    server s1 127.0.0.1:10006
backend bk_10007
    server s1 127.0.0.1:10007
backend bk_10008
    server s1 127.0.0.1:10008 proto h2
backend bk_10009
    server s1 127.0.0.1:10009

backend bk_10020_ssh
    server s1 127.0.0.1:10020
backend bk_10010
    server s1 127.0.0.1:10010
backend bk_10011
    server s1 127.0.0.1:10011 proto h2

backend bk_10012_grpc
    server s1 127.0.0.1:10012 proto h2
backend bk_10013_grpc
    server s1 127.0.0.1:10013 proto h2
backend bk_10014_grpc
    server s1 127.0.0.1:10014 proto h2
backend bk_10015_grpc
    server s1 127.0.0.1:10015 proto h2

# H2 (Xray "http" transport) backends - real HTTP/2 duplex, same as gRPC
backend bk_10016_h2
    server s1 127.0.0.1:10016 proto h2
backend bk_10017_h2
    server s1 127.0.0.1:10017 proto h2
backend bk_10018_h2
    server s1 127.0.0.1:10018 proto h2
backend bk_10019_h2
    server s1 127.0.0.1:10019 proto h2
