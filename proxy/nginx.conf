worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Populated by entrypoint.sh at container start (empty when the
    # corresponding upstream is not configured for this deploy).
    include /etc/nginx/relay-upstream.conf;

    server {
        listen 8080;
        server_name _;

        # HTTP-Upgrade handshake -> ws_bridge.py -> Dropbear :2200
        location /saeka-ssh {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # OpenVPN profile download, basic-auth gated (cert_server.py)
        location /cert {
            proxy_pass http://127.0.0.1:2224;
            proxy_set_header Host $host;
        }

        # /saeka-ovpn (ws_bridge -> OVPN VM) and the XHTTP path (-> VM :8443,
        # pinned self-signed) both land here when their env vars are set.
        include /etc/nginx/relay-location.conf;

        location / {
            return 404;
        }
    }
}
